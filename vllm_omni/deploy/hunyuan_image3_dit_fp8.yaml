# HunyuanImage-3.0-Instruct DiT-only + online FP8 (CUDA).
# Variant of hunyuan_image3_dit.yaml with quantization: fp8 enabled on the
# default (cuda) stage so TP/SP/AllGather sweeps can be driven purely via CLI
# flags (--tensor-parallel-size, --ulysses-degree, --allgather-degree).
pipeline: hunyuan_image3_dit
async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.9
    enforce_eager: true
    devices: "0,1,2,3"
    quantization: fp8
    vae_use_slicing: false
    vae_use_tiling: false
    cache_backend:
    cache_config:
    enable_cache_dit_summary: false
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      enable_expert_parallel: true
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      vae_patch_parallel_size: 1
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
    default_sampling_params:
      seed: 42
